apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-image-volume
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: ahmedelsherbiny0/todo-app:v1.3
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: todo-image-volume
              mountPath: /usr/src/app/files
