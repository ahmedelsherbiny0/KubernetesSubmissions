apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-image-volume
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: ahmedelsherbiny0/todo-app:v1.7
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-app-configmap
                  key: APP_PORT
            - name: IMAGE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-configmap
                  key: IMAGE_URL
            - name: TIME
              valueFrom:
                configMapKeyRef:
                  name: todo-app-configmap
                  key: TIME
          volumeMounts:
            - name: todo-image-volume
              mountPath: /usr/src/app/files
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: ahmedelsherbiny0/todo-backend:v1.3
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-app-configmap
                  key: APP_BACKEND_PORT
          envFrom:
            - secretRef:
                name: postgres-secret
