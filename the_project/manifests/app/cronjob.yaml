apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-cronjob
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-cronjob
              image: curlimages/curl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  URL=$(curl -s -I -o /dev/null -w "%{redirect_url}" "https://en.wikipedia.org/wiki/Special:Random")                                      
                  echo "Random article found: $URL"
                  curl -s -X POST http://todo-backend-svc:2345/todos -H "Content-Type: application/json" -d "{\"task\": \"Read $URL\"}"
