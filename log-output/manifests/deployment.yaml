apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: log-volume
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: string-generator
          image: ahmedelsherbiny0/string-generator:v1.0
          volumeMounts:
            - name: log-volume
              mountPath: /usr/src/app/files
        - name: string-response
          image: ahmedelsherbiny0/string-response:v1.4
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: log-volume
              mountPath: /usr/src/app/files
