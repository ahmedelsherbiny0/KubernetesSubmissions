apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: ping-pong-volume
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: ping-pong
          image: ahmedelsherbiny0/ping-pong:v1.2
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: ping-pong-volume
              mountPath: /usr/src/app/files
