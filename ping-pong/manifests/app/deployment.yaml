apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ahmedelsherbiny0/ping-pong:v1.4
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ping-pong-configmap
                  key: APP_PORT
          envFrom:
            - secretRef:
                name: postgres-secret
